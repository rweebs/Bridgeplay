<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Helvetica, Arial, sans-serif"><rect width="960" height="340" fill="#FFFFFF"/><text x="480" y="34.0" font-size="20" fill="#17354C" font-weight="700" text-anchor="middle">Ten fork etiquettes for makers, maintainers, and onlookers</text><rect x="40" y="70" width="166" height="120" rx="12" fill="#E3F5F4" stroke="#20C7C9" stroke-width="2"/><text x="54" y="100.0" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">1. Talk to</text><text x="54" y="120.8" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">upstream</text><text x="54" y="150.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">before launching</text><rect x="218" y="70" width="166" height="120" rx="12" fill="#E3F5F4" stroke="#20C7C9" stroke-width="2"/><text x="232" y="100.0" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">2. Respect</text><text x="232" y="120.8" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">intent</text><text x="232" y="150.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">that is written</text><rect x="396" y="70" width="166" height="120" rx="12" fill="#E3F5F4" stroke="#20C7C9" stroke-width="2"/><text x="410" y="100.0" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">3. Credit</text><text x="410" y="120.8" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">upstream</text><text x="410" y="150.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">in every promo</text><rect x="574" y="70" width="166" height="120" rx="12" fill="#E3F5F4" stroke="#20C7C9" stroke-width="2"/><text x="588" y="100.0" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">4. Wait for</text><text x="588" y="120.8" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">merge</text><text x="588" y="150.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">don't take drafts</text><rect x="752" y="70" width="166" height="120" rx="12" fill="#E3F5F4" stroke="#20C7C9" stroke-width="2"/><text x="766" y="100.0" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">5. Test claims</text><text x="766" y="129.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">before calling it a</text><text x="766" y="145.9" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">fix</text><rect x="40" y="210" width="166" height="120" rx="12" fill="#E3F5F4" stroke="#20C7C9" stroke-width="2"/><text x="54" y="240.0" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">6. Disclose AI</text><text x="54" y="269.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">and how it's tested</text><rect x="218" y="210" width="166" height="120" rx="12" fill="#FFF8E6" stroke="#E9B949" stroke-width="2"/><text x="232" y="240.0" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">7. Critique code</text><text x="232" y="269.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">not the person</text><rect x="396" y="210" width="166" height="120" rx="12" fill="#FFF8E6" stroke="#E9B949" stroke-width="2"/><text x="410" y="240.0" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">8. Write intent</text><text x="410" y="269.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">in upstream README</text><rect x="574" y="210" width="166" height="120" rx="12" fill="#FFF8E6" stroke="#E9B949" stroke-width="2"/><text x="588" y="240.0" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">9. Pick a</text><text x="588" y="260.8" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">license</text><text x="588" y="290.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">that fits your wish</text><rect x="752" y="210" width="166" height="120" rx="12" fill="#FFF8E6" stroke="#E9B949" stroke-width="2"/><text x="766" y="240.0" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">10. Don't pile</text><text x="766" y="260.8" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">on</text><text x="766" y="290.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">or rush to judge</text></svg>