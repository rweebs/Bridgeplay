<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="Helvetica, Arial, sans-serif"><rect width="960" height="390" fill="#FFFFFF"/><text x="480" y="34.0" font-size="20" fill="#17354C" font-weight="700" text-anchor="middle">What I noted on 21 October, and what came up a day later</text><rect x="40" y="60" width="430" height="300" rx="12" fill="#E3F5F4" stroke="#0E8F91" stroke-width="2"/><text x="60" y="92.0" font-size="17" fill="#0E8F91" font-weight="700" text-anchor="start">My notes (issue #2)</text><text x="60" y="130.0" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">Promo post does not name NotProton</text><text x="60" y="153.8" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">Website did not yet say 'fork'</text><text x="60" y="177.6" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">Apple license terms not yet mapped</text><text x="60" y="201.4" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">Question: doesn't CrossOver already exist?</text><text x="60" y="225.2" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">Status: no license violation</text><rect x="490" y="60" width="430" height="300" rx="12" fill="#FFF8E6" stroke="#C2410C" stroke-width="2"/><text x="510" y="92.0" font-size="17" fill="#C2410C" font-weight="700" text-anchor="start">Objections in issue #79</text><text x="510" y="130.0" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">Promo post cited as evidence of a 'narrative'</text><text x="510" y="153.8" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">Bridgeplay seen as hurting CrossOver sales</text><text x="510" y="177.6" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">Unmerged PRs were taken in</text><text x="510" y="201.4" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">AI-written code quality questioned</text><text x="510" y="225.2" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">Request: stop, then delete</text></svg>