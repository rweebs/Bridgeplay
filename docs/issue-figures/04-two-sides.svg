<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="Helvetica, Arial, sans-serif"><rect width="960" height="390" fill="#FFFFFF"/><text x="480" y="34.0" font-size="20" fill="#17354C" font-weight="700" text-anchor="middle">Both sides hold part of the truth</text><rect x="40" y="60" width="430" height="300" rx="12" fill="#FFF8E6" stroke="#8A6100" stroke-width="2"/><text x="60" y="92.0" font-size="17" fill="#8A6100" font-weight="700" text-anchor="start">The upstream maintainer is right that</text><text x="60" y="130.0" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">Wine on macOS depends on CodeWeavers</text><text x="60" y="153.8" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">their intent was stated openly</text><text x="60" y="177.6" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">unmerged PRs are not ready to ship</text><text x="60" y="201.4" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">the 32-bit fix claim was not proven</text><text x="60" y="225.2" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">upstream sustainability deserves defending</text><rect x="490" y="60" width="430" height="300" rx="12" fill="#E3F5F4" stroke="#0E8F91" stroke-width="2"/><text x="510" y="92.0" font-size="17" fill="#0E8F91" font-weight="700" text-anchor="start">The Bridgeplay owner is right that</text><text x="510" y="130.0" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">GPL-3.0 allows forks without blessing</text><text x="510" y="153.8" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">attribution was in README and NOTICE</text><text x="510" y="177.6" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">sharing for free is a GPL freedom</text><text x="510" y="201.4" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">they admitted and withdrew mistakes</text><text x="510" y="225.2" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">they ask users to buy CrossOver</text></svg>