<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Helvetica, Arial, sans-serif"><rect width="960" height="360" fill="#FFFFFF"/><text x="480" y="34.0" font-size="20" fill="#17354C" font-weight="700" text-anchor="middle">Three layers that decide whether a fork is accepted</text><rect x="40" y="70" width="260" height="150" rx="12" fill="#E3F5F4" stroke="#20C7C9" stroke-width="2"/><text x="54" y="100.0" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">Law</text><text x="54" y="129.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">the license answers: allowed</text><text x="54" y="145.9" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">or not</text><line x1="302" y1="145" x2="330" y2="145" stroke="#0E8F91" stroke-width="2"/><polygon points="338,145 328,139 328,151" fill="#0E8F91"/><rect x="340" y="70" width="260" height="150" rx="12" fill="#E3F5F4" stroke="#20C7C9" stroke-width="2"/><text x="354" y="100.0" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">Ethics</text><text x="354" y="129.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">attribution and reciprocity:</text><text x="354" y="145.9" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">fitting or not</text><line x1="602" y1="145" x2="630" y2="145" stroke="#0E8F91" stroke-width="2"/><polygon points="638,145 628,139 628,151" fill="#0E8F91"/><rect x="640" y="70" width="260" height="150" rx="12" fill="#E3F5F4" stroke="#20C7C9" stroke-width="2"/><text x="654" y="100.0" font-size="16" fill="#17354C" font-weight="700" text-anchor="start">Relationship</text><text x="654" y="129.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">upstream intent and</text><text x="654" y="145.9" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">dialogue: welcome or not</text><line x1="480" y1="222" x2="480" y2="254" stroke="#5C7180" stroke-width="2"/><polygon points="480,262 474,252 486,252" fill="#5C7180"/><rect x="40" y="264" width="880" height="76" rx="12" fill="#0E8F91" stroke="#0E8F91" stroke-width="1.5"/><text x="480" y="308.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">Bridgeplay passes the first layer. The dispute happened in the second and third.</text></svg>