<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Helvetica, Arial, sans-serif"><rect width="960" height="330" fill="#FFFFFF"/><text x="480" y="34.0" font-size="20" fill="#17354C" font-weight="700" text-anchor="middle">The five gaps in issue #2 and what happened to them</text><rect x="40" y="60" width="430" height="250" rx="12" fill="#E3F5F4" stroke="#0E8F91" stroke-width="2"/><text x="60" y="92.0" font-size="17" fill="#0E8F91" font-weight="700" text-anchor="start">Fixed</text><text x="60" y="132.0" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">(2) Website now says 'a fork of NotProton'</text><text x="60" y="157.9" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">(4) docs/GPTK-LICENSE.md maps Apple's terms</text><text x="60" y="183.8" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">Later: README 'Support Wine', a call to</text><text x="60" y="209.7" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">buy CrossOver; credit in the app (24 Oct)</text><rect x="490" y="60" width="430" height="250" rx="12" fill="#FFF8E6" stroke="#8A6100" stroke-width="2"/><text x="510" y="92.0" font-size="17" fill="#8A6100" font-weight="700" text-anchor="start">Declined or pending</text><text x="510" y="132.0" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">(1) Promo post: declined, GPL doesn't require it</text><text x="510" y="157.9" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">(3) GitHub fork marker: README judged enough</text><text x="510" y="183.8" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">(5) Per-file headers: not yet audited</text><text x="510" y="209.7" font-size="14" fill="#17354C" font-weight="400" text-anchor="start">Issue closed as 'completed' the same day</text></svg>