<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="960" height="290" font-family="Helvetica, Arial, sans-serif"><rect width="960" height="290" fill="#FFFFFF"/><text x="480" y="34.0" font-size="20" fill="#17354C" font-weight="700" text-anchor="middle">Four days, from a polite note to an open dispute</text><polygon points="40,70 194,70 216,130 194,190 40,190 62,130" fill="#E3F5F4" stroke="#20C7C9" stroke-width="2"/><text x="70" y="112.0" font-size="15" fill="#17354C" font-weight="700" text-anchor="start">21 Oct</text><text x="46" y="222.0" font-size="12" fill="#5C7180" font-weight="400" text-anchor="start">attribution note: no</text><text x="46" y="237.0" font-size="12" fill="#5C7180" font-weight="400" text-anchor="start">violations, five small</text><text x="46" y="252.0" font-size="12" fill="#5C7180" font-weight="400" text-anchor="start">gaps</text><polygon points="216,70 370,70 392,130 370,190 216,190 238,130" fill="#E3F5F4" stroke="#20C7C9" stroke-width="2"/><text x="246" y="112.0" font-size="15" fill="#17354C" font-weight="700" text-anchor="start">21 Oct</text><text x="222" y="222.0" font-size="12" fill="#5C7180" font-weight="400" text-anchor="start">two gaps fixed, two</text><text x="222" y="237.0" font-size="12" fill="#5C7180" font-weight="400" text-anchor="start">declined, issue closed</text><polygon points="392,70 546,70 568,130 546,190 392,190 414,130" fill="#E3F5F4" stroke="#20C7C9" stroke-width="2"/><text x="422" y="112.0" font-size="15" fill="#17354C" font-weight="700" text-anchor="start">22 Oct</text><text x="398" y="222.0" font-size="12" fill="#5C7180" font-weight="400" text-anchor="start">upstream maintainer</text><text x="398" y="237.0" font-size="12" fill="#5C7180" font-weight="400" text-anchor="start">opens 'This should not</text><text x="398" y="252.0" font-size="12" fill="#5C7180" font-weight="400" text-anchor="start">exist.'</text><polygon points="568,70 722,70 744,130 722,190 568,190 590,130" fill="#E3F5F4" stroke="#20C7C9" stroke-width="2"/><text x="598" y="112.0" font-size="15" fill="#17354C" font-weight="700" text-anchor="start">23 Oct</text><text x="574" y="222.0" font-size="12" fill="#5C7180" font-weight="400" text-anchor="start">block, removal</text><text x="574" y="237.0" font-size="12" fill="#5C7180" font-weight="400" text-anchor="start">request, then personal</text><text x="574" y="252.0" font-size="12" fill="#5C7180" font-weight="400" text-anchor="start">attacks</text><polygon points="744,70 898,70 920,130 898,190 744,190 766,130" fill="#E3F5F4" stroke="#20C7C9" stroke-width="2"/><text x="774" y="112.0" font-size="15" fill="#17354C" font-weight="700" text-anchor="start">24 Oct</text><text x="750" y="222.0" font-size="12" fill="#5C7180" font-weight="400" text-anchor="start">credit made clearer in</text><text x="750" y="237.0" font-size="12" fill="#5C7180" font-weight="400" text-anchor="start">wizard, README, site,</text><text x="750" y="252.0" font-size="12" fill="#5C7180" font-weight="400" text-anchor="start">app</text></svg>