<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" font-family="Helvetica, Arial, sans-serif"><rect width="960" height="345" fill="#FFFFFF"/><text x="480" y="34.0" font-size="20" fill="#17354C" font-weight="700" text-anchor="middle">The escalation ladder: from judging code to judging people</text><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#20C7C9"/><stop offset="0.5" stop-color="#E9B949"/><stop offset="1" stop-color="#C2410C"/></linearGradient></defs><rect x="50" y="110" width="860" height="22" rx="11" fill="url(#g)"/><circle cx="50" cy="121" r="11" fill="#FFFFFF" stroke="#17354C" stroke-width="2.5"/><text x="50" y="164.0" font-size="15" fill="#17354C" font-weight="700" text-anchor="start">Polite note</text><text x="50" y="184.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="start">gaps, not accusations</text><text x="50" y="86.0" font-size="14" fill="#0E8F91" font-weight="700" text-anchor="start">healthy</text><circle cx="265" cy="121" r="11" fill="#FFFFFF" stroke="#17354C" stroke-width="2.5"/><text x="265" y="164.0" font-size="15" fill="#17354C" font-weight="700" text-anchor="middle">Principled objection</text><text x="265" y="184.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="middle">impact on upstream</text><circle cx="480" cy="121" r="11" fill="#FFFFFF" stroke="#17354C" stroke-width="2.5"/><text x="480" y="164.0" font-size="15" fill="#17354C" font-weight="700" text-anchor="middle">'Slop' label</text><text x="480" y="184.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="middle">quality attacked</text><circle cx="695" cy="121" r="11" fill="#FFFFFF" stroke="#17354C" stroke-width="2.5"/><text x="695" y="164.0" font-size="15" fill="#17354C" font-weight="700" text-anchor="middle">Block and delete</text><text x="695" y="184.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="middle">relationship cut</text><circle cx="910" cy="121" r="11" fill="#FFFFFF" stroke="#17354C" stroke-width="2.5"/><text x="910" y="164.0" font-size="15" fill="#17354C" font-weight="700" text-anchor="end">Personal attacks</text><text x="910" y="184.0" font-size="13" fill="#5C7180" font-weight="400" text-anchor="end">character attacked</text><text x="910" y="86.0" font-size="14" fill="#C2410C" font-weight="700" text-anchor="end">harmful</text><rect x="40" y="230" width="880" height="90" rx="12" fill="#E3F5F4" stroke="#20C7C9" stroke-width="1.5"/><text x="60" y="270.0" font-size="14" fill="#17354C" font-weight="600" text-anchor="start">The first three rungs can still be answered with code and data. The last two only leave hurt.</text></svg>